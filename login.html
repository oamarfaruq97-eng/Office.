<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login | MR Mecaw</title>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800">
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #d92f35;
      }
    </style>

    <div class="mx-auto max-w-6xl px-3 py-6 sm:px-4 sm:py-8">
        <header class="overflow-hidden rounded-2xl shadow-lg shadow-red-200/60 ring-1 ring-red-100">
            <div class="flex flex-col gap-4 bg-gradient-to-r from-[#b91c1c] via-[#d92f35] to-[#7f1d1d] px-4 py-4 text-white sm:px-5">
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-white/15 text-lg font-bold shadow-inner">M</div>
                        <div>
                            <p class="text-[10px] uppercase tracking-[0.2em] text-red-100 sm:text-xs">Brand</p>
                            <h1 class="text-lg font-semibold sm:text-xl">MR Mecaw</h1>
                        </div>
                    </div>

                    <a href="login.html" class="inline-flex items-center gap-2 rounded-full bg-white px-3 py-2 text-xs font-semibold text-red-700 shadow-md transition hover:scale-[1.02] hover:bg-red-50 sm:text-sm" aria-label="Login" aria-current="page">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 21a8 8 0 0 0-16 0"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <span>Login</span>
                    </a>
                </div>

                <nav class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <div class="relative w-full sm:w-auto sm:max-w-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <input type="text" placeholder="Search..." class="h-10 w-full rounded-full border border-white/30 bg-white/10 pl-9 pr-3 text-sm text-white placeholder:text-red-100 outline-none transition focus:bg-white/15 focus:ring-2 focus:ring-white/50 sm:w-40">
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <a href="index.html" class="rounded-full px-3 py-2 text-sm font-medium text-red-50 transition hover:bg-white/10 hover:text-white">Home</a>
                        <a href="about.html" class="rounded-full px-3 py-2 text-sm font-medium text-red-50 transition hover:bg-white/10 hover:text-white">About</a>
                        <a href="contact.html" class="rounded-full px-3 py-2 text-sm font-medium text-red-50 transition hover:bg-white/10 hover:text-white">Contact</a>
                    </div>
                </nav>
            </div>
        </header>
    </div>
    <main class="mx-auto flex min-h-[calc(100vh-10rem)] max-w-6xl items-center justify-center px-4 py-10">
        <section class="w-full max-w-md rounded-2xl bg-white p-6 shadow-lg shadow-red-200/40 ring-1 ring-slate-200 sm:p-8">
            <div class="mb-8 text-center">
                <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-red-100 text-red-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21a8 8 0 0 0-16 0"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <h2 class="mt-4 text-2xl font-bold text-slate-900">Welcome back</h2>
                <p class="mt-2 text-sm text-slate-500">Sign in to your MR Mecaw account</p>
            </div>

            <form action="index.html" class="space-y-5">
                <div>
                    <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com" class="block w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-red-500 focus:ring-4 focus:ring-red-100">
                </div>

                <div>
                    <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Enter your password" class="block w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-red-500 focus:ring-4 focus:ring-red-100">
                </div>

                <button type="submit" class="w-full rounded-xl bg-red-600 px-4 py-3 font-semibold text-white shadow-md shadow-red-200 transition hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-200">
                    Sign in
                </button>
            </form>
        </section>
    </main>

    <footer class="bg-white text-slate-400">
        <div class="mx-auto max-w-6xl px-4 py-8">
            <p class="text-center text-sm">© 2026 MR Mecaw. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
